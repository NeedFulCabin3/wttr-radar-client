name: Code Health Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-markup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML Markup
        run: |
          npx html-validate index.html

      - name: Basic JS Syntax Check
        run: |
          node -e "
            const fs = require('fs');
            const code = fs.readFileSync('script.js', 'utf8');
            new Function(code);
            console.log('script.js syntax valid.');
          "
